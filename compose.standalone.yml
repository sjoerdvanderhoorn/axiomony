# Standalone: MCP + REST + PostgreSQL + static HTTP hosting.
# Start: docker compose -f compose.yml -f compose.standalone.yml up -d --build
# Values for both passwords and the REST JWT secret must be configured in .env.
services:
  pg-mcp:
    environment:
      PGHOST: postgres-db
      PGPORT: '5432'
      PGSSL: 'false'
      APP_HOSTING_ENABLED: 'true'
      APP_HOSTING_DIR: /srv/user-sites
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8088}
      APP_MAX_FILE_BYTES: ${APP_MAX_FILE_BYTES:-1048576}
    volumes:
      - published_sites:/srv/user-sites:rw
    depends_on:
      postgres-db:
        condition: service_healthy
      sites-init:
        condition: service_completed_successfully

  rest-api:
    environment:
      PGHOST: postgres-db
      PGPORT: '5432'
      PGSSLMODE: disable
    depends_on:
      rest-init:
        condition: service_completed_successfully

  postgres-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE in .env}
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
    secrets:
      - postgres_bootstrap_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bundled/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform_admin -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    # No host port: the database is only reachable on this Compose network.

  # An idempotent one-shot container prepares a non-privileged PostgREST role.
  # This is an inline Compose command, not a separate host startup script.
  rest-init:
    image: postgres:17-alpine
    restart: 'no'
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        export PGPASSWORD="$$(cat /run/secrets/postgres_bootstrap_password)"
        psql -h postgres-db -U platform_admin -d "$${PGDATABASE}" \
          -v ON_ERROR_STOP=1 \
          -v rest_pw="$$(cat /run/secrets/rest_auth_password)" <<'SQL'
        SELECT 'CREATE ROLE postgrest_authenticator LOGIN NOINHERIT'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'postgrest_authenticator') \gexec
        SELECT 'CREATE ROLE web_anon NOLOGIN'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'web_anon') \gexec
        DO $$$$ BEGIN
          IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname='postgrest_authenticator'
            AND (rolsuper OR rolbypassrls OR rolcreaterole OR rolcreatedb OR rolreplication)) THEN
            RAISE EXCEPTION 'Refusing a privileged PostgREST authenticator';
          END IF;
        END $$$$;
        ALTER ROLE postgrest_authenticator WITH LOGIN NOINHERIT PASSWORD :'rest_pw';
        GRANT web_anon TO postgrest_authenticator WITH INHERIT FALSE, SET TRUE;
        SQL
    environment:
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
    secrets:
      - postgres_bootstrap_password
      - rest_auth_password
    depends_on:
      postgres-db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  sites-init:
    image: alpine:3.21
    restart: 'no'
    network_mode: none
    command: ['sh', '-c', 'mkdir -p /sites && chown 1000:1000 /sites && chmod 755 /sites']
    volumes:
      - published_sites:/sites
    security_opt:
      - no-new-privileges:true

  sites-web:
    image: nginx/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8088}:8080'
    volumes:
      - published_sites:/usr/share/nginx/html/apps:ro
      - ./hosting/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      sites-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  published_sites:

secrets:
  postgres_bootstrap_password:
    environment: POSTGRES_BOOTSTRAP_PASSWORD
  rest_auth_password:
    environment: REST_AUTH_PASSWORD