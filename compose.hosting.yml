# OPTIONAL: used only by scripts/start.sh if APP_HOSTING_ENABLED=true.
# The MCP server writes files as uid 1000; Nginx has a separate read-only mount.
services:
  pg-mcp:
    environment:
      APP_HOSTING_ENABLED: "true"
      APP_HOSTING_DIR: /srv/user-sites
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8088}
      APP_MAX_FILE_BYTES: ${APP_MAX_FILE_BYTES:-1048576}
    volumes:
      - published_sites:/srv/user-sites:rw
    depends_on:
      sites-init:
        condition: service_completed_successfully
  sites-init:
    image: alpine:3.21
    restart: "no"
    network_mode: none
    command: ["sh", "-c", "mkdir -p /sites && chown 1000:1000 /sites && chmod 755 /sites"]
    volumes:
      - published_sites:/sites
    security_opt:
      - no-new-privileges:true
  sites-web:
    image: nginx/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8088}:8080"
    volumes:
      - published_sites:/usr/share/nginx/html/apps:ro
      - ./hosting/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      sites-init:
        condition: service_completed_successfully
volumes:
  published_sites:
