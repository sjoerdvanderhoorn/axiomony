name: Node.js tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test

      - name: Validate both Docker Compose deployments
        env:
          PGDATABASE: axiomony_ci
          POSTGRES_BOOTSTRAP_PASSWORD: ci-only-bootstrap-password-not-for-production
          REST_AUTH_PASSWORD: ci-only-rest-password-not-for-production
          REST_JWT_SECRET: ci-only-rest-jwt-signing-secret-not-for-production
        run: |
          docker compose config --quiet
          docker compose -f compose.yml -f compose.standalone.yml config --quiet
